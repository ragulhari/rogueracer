<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>RogueRacer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow:wght@400;500;600;700;800&display=swap" />
  <style>
    :root {
      --bg: #0d0f14;
      --panel: rgba(14, 17, 24, 0.86);
      --line: rgba(255, 255, 255, 0.12);
      --text: #eef1f6;
      --muted: #9aa4b2;
      --accent: #ffcf3d;
      --good: #4ade80;
      --bad: #f87171;
      --display: "Russo One", "Arial Black", Impact, sans-serif;
      --body: "Barlow", "Segoe UI", system-ui, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: var(--body); }
    h1, h2, #center-msg, #speed, #hud-tl .big, .stat .v { font-family: var(--display); font-weight: 400; }
    canvas#game { display: block; width: 100vw; height: 100vh; }
    .hud { position: fixed; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000a; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
    #hud-tl { top: calc(16px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); display: grid; gap: 4px; min-width: 190px; }
    #hud-tl .big { font-size: 34px; font-weight: 800; line-height: 1; }
    #hud-tl .row { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--muted); }
    #hud-tl .row b { color: var(--text); font-weight: 600; }
    #hud-tr { top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); padding: 6px; }
    #minimap { display: block; width: 200px; height: 200px; }
    #hud-bl { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); min-width: 220px; }
    #speed { font-size: 46px; font-weight: 800; line-height: 1; }
    #speed small { font-size: 14px; color: var(--muted); font-weight: 500; }
    .bar { height: 8px; background: #ffffff1a; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; background: var(--good); width: 100%; transition: width .2s; }
    .label { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
    #draft { opacity: 0; transition: opacity .25s; }
    #draftbar { background: #8fd8ff; width: 0; transition: width .1s; }
    #nitro span { display: inline-block; width: 14px; height: 14px; border-radius: 3px; background: #4fd2ff; margin-right: 4px; box-shadow: 0 0 8px #4fd2ff; }
    #hud-br { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); text-align: right; font-size: 13px; color: var(--muted); max-width: 280px; }
    #hud-br b { color: var(--text); }
    #center-msg { top: 38%; left: 0; right: 0; text-align: center; font-size: 72px; font-weight: 900;
      letter-spacing: 2px; color: #fff; text-shadow: 0 4px 18px #000c; }
    #center-msg small { display: block; font-size: 20px; font-weight: 600; letter-spacing: 0; color: var(--accent); }
    #help { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted); }
    kbd { display: inline-block; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
      background: #ffffff10; color: var(--text); font-family: inherit; font-size: 12px; }

    #screen { position: fixed; inset: 0; display: none; align-items: flex-start; justify-content: center;
      background: radial-gradient(ellipse at center, #0d0f14cc 0%, #0d0f14f2 70%); padding: 24px; overflow-y: auto; z-index: 10; }
    #screen.show { display: flex; }
    .box { width: min(920px, 100%); text-align: center; margin: auto; }
    h1 { font-size: 52px; margin: 0 0 4px; letter-spacing: 1px; }
    h1 span { color: var(--accent); }
    h2 { font-size: 30px; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; }
    .card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 18px; text-align: left;
      cursor: pointer; transition: transform .12s, border-color .12s; position: relative; }
    .card.sel { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 10px 30px #ffcf3d22; }
    .card .key { position: absolute; top: 12px; right: 12px; }
    .card .cat { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    .card .name { font-size: 20px; font-weight: 700; margin: 6px 0 4px; }
    .card .rar { font-size: 12px; font-weight: 700; }
    .card .desc { margin-top: 12px; font-size: 14px; }
    .card .cons { margin-top: 6px; font-size: 13px; color: var(--bad); }
    .stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 130px; }
    .stat .v { font-size: 22px; font-weight: 800; }
    .stat .k { font-size: 12px; color: var(--muted); }
    .xpbar { height: 10px; background: #ffffff1a; border-radius: 5px; overflow: hidden; width: min(420px, 100%); margin: 8px auto; }
    .xpbar > i { display: block; height: 100%; background: var(--accent); }
    table.xp { margin: 12px auto; border-collapse: collapse; font-size: 15px; min-width: 320px; }
    table.xp td { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    table.xp td:last-child { text-align: right; color: var(--accent); font-weight: 700; }
    .standings { margin: 12px auto; border-collapse: collapse; min-width: 320px; }
    .standings td { padding: 4px 12px; text-align: left; }
    .standings tr.me td { color: var(--accent); font-weight: 700; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .actions { margin-top: 20px; color: var(--muted); font-size: 15px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
    .win { color: var(--good); } .lose { color: var(--bad); }
    .levelup { color: var(--accent); font-size: 22px; font-weight: 800; margin: 8px 0; }
    .menu { display: grid; gap: 6px; width: min(680px, 100%); margin: 18px auto; text-align: left; }
    .mrow { display: grid; grid-template-columns: 150px 1fr; gap: 4px 14px; align-items: center; padding: 10px 14px;
      border: 1px solid transparent; border-radius: 10px; cursor: pointer; }
    .mrow:has(.mode) { grid-template-columns: 1fr auto; background: var(--panel); border-color: var(--line); padding: 14px 16px; }
    .mrow.sel { border-color: var(--accent); background: #ffcf3d12; }
    .mrow .k { font-size: 13px; color: var(--muted); }
    .mrow .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
    .mrow .v { grid-column: 2; font-size: 13px; color: var(--text); }
    .mrow .v:empty { display: none; }
    .mrow .v.small { color: var(--muted); }
    .mode { display: grid; gap: 3px; }
    .mode b { font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--text); }
    .mrow.sel .mode b { color: var(--accent); }
    .mode span { font-size: 14px; color: var(--muted); }
    .mode .meta { color: var(--text); font-size: 13px; }
    .mdiv { height: 1px; background: var(--line); margin: 6px 0; }
    .muted { color: var(--muted); }
    .xpbar.small { height: 5px; margin: 4px 0 0; width: 100%; }
    .box.wide { width: min(1120px, 100%); }
    .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 18px 0; text-align: left; }
    .tcard { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; display: grid; gap: 4px; }
    .tcard.sel { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 24px #ffcf3d1f; }
    .tcard canvas { width: 100%; height: auto; border-radius: 8px; display: block; background: #0d0f14; }
    .tname { font-weight: 700; font-size: 15px; }
    .tmeta { font-size: 12px; color: var(--muted); }
    .tag { color: var(--accent); font-weight: 700; }
    @media (max-width: 560px) { .mrow { grid-template-columns: 1fr; } .mrow .v { grid-column: 1; } }
    .options { display: grid; gap: 10px; width: min(640px, 100%); margin: 16px auto; text-align: left; }
    .opt { display: grid; grid-template-columns: 170px 1fr; gap: 4px 14px; align-items: center; }
    .opt .k { font-size: 13px; color: var(--muted); }
    .opt .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .opt .v { grid-column: 2; font-size: 13px; color: var(--text); }
    .opt .v.small { color: var(--muted); }
    .livery-wrap { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .livery-wrap > div { display: grid; gap: 6px; }
    #car-preview { width: 70px; height: 140px; }
    @media (max-width: 560px) { .livery-wrap { grid-template-columns: 1fr; } #car-preview { justify-self: center; } }
    .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
    .swatch.on { border-color: #fff; box-shadow: 0 0 0 3px var(--accent); }
    .chip { font: inherit; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--line); background: #ffffff0d; color: var(--muted); }
    .chip.on { background: var(--accent); color: #1a1405; border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 560px) { .opt { grid-template-columns: 1fr; } .opt .v { grid-column: 1; } }
    .controls { display: grid; grid-template-columns: auto auto auto auto; gap: 6px 14px; justify-content: center; text-align: left; font-size: 14px; color: var(--muted); margin: 16px auto; }
    /* ---------- telas de toque ---------- */
    .touch-only { display: none; }
    .actions [data-key] { cursor: pointer; }
    .touch .touch-only { display: initial; }
    .touch p.touch-only { display: block; }
    .touch .kbd-only, .touch .controls, .touch .actions span:not([data-key]):not(.touch-only) { display: none; }
    .touch kbd { display: none; }
    .touch .actions [data-key] { padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: #ffffff10; color: var(--text); }
    .touch body { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    .touch .mrow kbd { display: none; }
    #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; -webkit-user-select: none; user-select: none; }
    .touch.racing #touch { display: block; }
    #touch button { position: absolute; pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent;
      border: 2px solid #ffffff38; background: #0d0f1488; color: #fff; border-radius: 20px; font: 700 14px var(--body); letter-spacing: 1px; }
    #touch button.on { background: #ffcf3d55; border-color: var(--accent); }
    #touch .t-left, #touch .t-right { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; font-size: 30px; }
    #touch .t-left { left: calc(14px + env(safe-area-inset-left, 0px)); }
    #touch .t-right { left: calc(118px + env(safe-area-inset-left, 0px)); }
    #touch .t-gas { right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 112px; height: 124px; border-color: #4ade8099; }
    #touch .t-brake { right: calc(138px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 88px; height: 88px; border-color: #e5484d99; }
    #touch .t-nitro { right: calc(138px + env(safe-area-inset-right, 0px)); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); width: 88px; height: 48px; border-color: #4fd2ff99; font-size: 12px; }
    #touch .t-pause, #touch .t-reset { top: calc(116px + env(safe-area-inset-top, 0px)); width: 48px; height: 44px; font-size: 18px; border-radius: 12px; }
    #touch .t-pause { right: calc(8px + env(safe-area-inset-right, 0px)); }
    #touch .t-reset { right: calc(62px + env(safe-area-inset-right, 0px)); }
    .touch #hud-tl { top: calc(8px + env(safe-area-inset-top, 0px)); left: calc(8px + env(safe-area-inset-left, 0px)); min-width: 0; padding: 6px 10px; gap: 2px; }
    .touch #hud-tl .big { font-size: 24px; }
    .touch #hud-tl .row:nth-child(n + 3) { display: none; }
    .touch #hud-br, .touch #hud-bl .tire { display: none; }
    .touch #hud-bl { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto; left: 50%; transform: translateX(-50%); min-width: 0;
      display: flex; align-items: center; gap: 12px; padding: 6px 12px; }
    .touch #speed { font-size: 24px; white-space: nowrap; }
    .touch #hud-bl .label { margin-top: 0; gap: 6px; }
    .touch #draft { width: 64px; }
    .touch #draft .bar { margin-top: 2px; }
    .touch #hud-tr { top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); padding: 4px; }
    .touch #minimap { width: 96px; height: 96px; }
    .touch #center-msg { font-size: 40px; top: 30%; }
    .touch #center-msg small { font-size: 16px; }
    .touch #screen { padding: 12px calc(12px + env(safe-area-inset-right, 0px)) 12px calc(12px + env(safe-area-inset-left, 0px)); }
    #rotate { display: none; }
    @media (orientation: portrait) {
      .touch:not(.portrait-ok) #rotate { display: flex; position: fixed; inset: 0; z-index: 20; background: var(--bg); align-items: center; justify-content: center; text-align: center; padding: 24px; }
    }
    @media (max-height: 500px) {
      h1 { font-size: 34px; } h2 { font-size: 22px; }
      .cards { gap: 10px; margin: 12px 0; } .card { padding: 12px; } .card .desc { margin-top: 6px; }
      .card.sel { transform: none; }
    }
    @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } h1 { font-size: 36px; } #minimap { width: 120px; height: 120px; } }
    /* celular deitado: três bônus lado a lado e botão de seguir sempre à vista */
    @media (max-height: 500px) and (orientation: landscape) {
      .cards { grid-template-columns: repeat(3, 1fr); }
      .card .name { font-size: 16px; } .card .desc { font-size: 13px; }
      .mrow { padding: 6px 12px; }
      .mrow[data-row="go"] { position: sticky; bottom: 0; background: #1a1d16; z-index: 1; }
      .mrow[data-row="go"] .mode span { display: none; }
      .mrow[data-row="go"] .mode b { font-size: 20px; }
      .controls { margin: 8px auto; }
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>

  <div id="hud" style="display:none">
    <div id="hud-tl" class="hud panel">
      <div class="big" id="pos">4º<small style="font-size:16px;color:var(--muted)">/4</small></div>
      <div class="row">Volta <b id="lap">1/3</b></div>
      <div class="row">Tempo <b id="time">0:00.0</b></div>
      <div class="row">Melhor volta <b id="bestlap">—</b></div>
    </div>
    <div id="hud-tr" class="hud panel"><canvas id="minimap" width="400" height="400"></canvas></div>
    <div id="hud-bl" class="hud panel">
      <div id="speed">0 <small>km/h</small></div>
      <div class="label tire"><span>Pneus</span><span id="tirepct">100%</span></div>
      <div class="bar tire"><i id="tirebar"></i></div>
      <div class="label"><span>Nitro <kbd>Shift</kbd></span><span id="nitro"></span></div>
      <div id="draft"><div class="label"><span>Vácuo</span></div><div class="bar"><i id="draftbar"></i></div></div>
    </div>
    <div id="hud-br" class="hud panel"></div>
    <div id="center-msg" class="hud"></div>
  </div>

  <!-- controles na tela (só em telas de toque) -->
  <div id="touch">
    <button data-k="ArrowLeft" class="t-left" aria-label="Virar à esquerda">◀</button>
    <button data-k="ArrowRight" class="t-right" aria-label="Virar à direita">▶</button>
    <button data-k="ShiftLeft" class="t-nitro">NITRO</button>
    <button data-k="ArrowDown" class="t-brake">FREIO</button>
    <button data-k="ArrowUp" class="t-gas">ACELERAR</button>
    <button data-k="Escape" class="t-pause" aria-label="Pausa">❚❚</button>
    <button data-k="KeyR" class="t-reset" aria-label="Voltar para a pista">↺</button>
  </div>
  <div id="rotate"><div><h2>Gire o celular</h2><p class="sub">O RogueRacer fica melhor com o celular deitado.</p><button class="chip on">Jogar assim mesmo</button></div></div>

  <div id="screen" class="show"><div class="box"><h2>Carregando o jogo…</h2></div></div>

  <script>
    // Se algo falhar ao iniciar, mostra o motivo em vez de uma tela preta.
    (function () {
      function show(title, detail) {
        var el = document.getElementById('screen');
        if (!el) return;
        el.className = 'show';
        el.innerHTML = '<div class="box"><h2>' + title + '</h2><p class="sub">' + detail + '</p></div>';
      }
      window.__showBootError = show;
      window.addEventListener('error', function (e) {
        if (window.__started) return;
        show('O jogo não conseguiu iniciar', 'Erro: ' + String(e.message || e.error || 'desconhecido') +
          '<br>Tente recarregar a página. Se continuar, use o Chrome, Edge ou Firefox atualizado.');
      });
      setTimeout(function () {
        if (window.__started) return;
        var local = location.protocol === 'file:';
        show('O jogo não iniciou', local
          ? 'Este arquivo index.html é o código-fonte e não abre direto no navegador.<br>Abra o arquivo <b>jogar.html</b> (na mesma pasta) ou rode <kbd>npm install</kbd> e <kbd>npm run dev</kbd>.'
          : 'Tente recarregar a página. Se continuar, use o Chrome, Edge ou Firefox atualizado.');
      }, 6000);
    })();
  </script>
